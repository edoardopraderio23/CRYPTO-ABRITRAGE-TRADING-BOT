# =============================================================
# Project Omni-Arb · Continuous Integration
# Runs on every push to main and on every pull request.
# =============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
        if: always()

  ai-tag-check:
    name: Verify AI-agent commit tags
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that AI-authored commits are tagged
        run: |
          echo "Verifying [AI-AGENT-CONTRIBUTION] tag on AI-authored commits."
          echo "Manual check enforced by reviewers per AGENTS.md §2.1."
          # Future: parse commit metadata for AI co-author trailers
          #        and fail the build if [AI-AGENT-CONTRIBUTION] is missing.
          exit 0
